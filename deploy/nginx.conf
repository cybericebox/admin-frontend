server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Content-Security-Policy, generated at container start by deploy/csp.sh. A location that sets its
    # own add_header does not inherit the server-level ones, so it must include this file again.
    include /etc/nginx/snippets/csp.conf;

    # Static export uses /<path>.html; retain the directory fallback.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # /errors/<groupID> is the one exported `errors` page: the id is read from the address in the browser.
    # Notification messages link here. try_files makes $uri /errors.html, so the CSP map of that page applies.
    location ~ "^/errors/[0-9a-fA-F-]{36}/?$" {
        try_files /errors.html =404;
    }

    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    error_page 404 /404.html;
}
