server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Static export with trailingSlash: pages live at /<path>/index.html.
    # Resolve /x → /x.html → /x/ (index.html) → 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
