server {
    absolute_redirect off;
    # Listeners and client auth: snippets rendered at container start by deploy/nginx-entrypoint.sh (empty when off).
    include /tmp/nginx-gen/listen-http.conf;
    include /tmp/nginx-gen/listen-https.conf;
    include /tmp/nginx-gen/client-auth.conf;
    server_name _;
    root /usr/share/nginx/html;

    # Content-Security-Policy, generated at container start by deploy/csp.sh. A location that sets its
    # own add_header does not inherit the server-level ones, so it must include this file again.
    include /tmp/nginx-gen/csp.conf;

    # Static export with trailingSlash: every page is /<path>/index.html and the canonical URL ends with a slash.
    # A path without the slash that is a directory of the export redirects once (308, relative Location, query kept) to the
    # slashed form. A file (an asset, robots.txt) is served as it is. The root of /x/ is never listed, an unknown path is the 404 page.
    location / {
        set $slash_redirect "";
        if (-d $request_filename) { set $slash_redirect "dir"; }
        if ($uri !~ "/$") { set $slash_redirect "${slash_redirect}-bare"; }
        if ($slash_redirect = "dir-bare") {
            return 308 $uri/$is_args$args;
        }
        try_files $uri =404;
    }

    # /errors/<groupID> is the one exported `errors` page: the id is read from the address in the browser.
    # Notification messages link here. try_files makes $uri /errors/index.html, so the CSP map of that page applies.
    location ~ "^/errors/[0-9a-fA-F-]{36}/?$" {
        try_files /errors/index.html =404;
    }

    # A path with the slash is the page of that directory: only its index.html, never a directory listing or a 403.
    location ~ "/$" {
        try_files $uri/index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    error_page 404 /404.html;
}
