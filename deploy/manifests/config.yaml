apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-frontend-config
  namespace: cybericebox
data:
  # All hosts are required (bare host, no scheme); fill them from platform.env.
  MAIN_HOST: ""
  API_HOST: ""
  ID_HOST: ""
  ADMIN_HOST: ""
  EXERCISES_HOST: ""
  EVENT_DOMAIN: ""
  # Shared cookie domain for the theme and consent cookies (apex, e.g. cybericebox.com); required.
  COOKIE_DOMAIN: ""
  # REQUIRED: support mailbox of the «Надіслати відгук» (send feedback) link on every page.
  SUPPORT_EMAIL: ""
  # Optional Google Analytics 4 measurement id (G-…). Empty → analytics off.
  GOOGLE_ANALYTICS_ID: ""
  # Bot check (anti-abuse): one provider for the whole platform, the same value in every app: turnstile | recaptcha | none.
  CAPTCHA_PROVIDER: "none"
  # Site key of the provider; REQUIRED when CAPTCHA_PROVIDER is not none.
  CAPTCHA_SITE_KEY: ""
  # reCAPTCHA Enterprise instead of v3 (true | false); only read when CAPTCHA_PROVIDER is recaptcha.
  RECAPTCHA_ENTERPRISE: "false"
  # Client token (anti-DoS): on | off, must match the backend DOS_PROTECTION.
  DOS_PROTECTION: "off"
