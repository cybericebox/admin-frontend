apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-frontend-config
  namespace: cybericebox
data:
  # All hosts are required (bare host, no scheme); fill them from platform.env.
  MAIN_HOST: ""
  API_HOST: ""
  ID_HOST: ""
  ADMIN_HOST: ""
  EXERCISES_HOST: ""
  EVENT_DOMAIN: ""
  # Optional Google Analytics 4 measurement id (G-…). Empty → analytics off.
  GOOGLE_ANALYTICS_ID: ""
